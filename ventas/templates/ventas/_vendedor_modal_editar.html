{% load l10n %}
<form method="post" action="{% url 'ventas:vendedor_update' vendedor.pk %}" id="formEditarVendedorSubmit">
    {% csrf_token %}
    <div class="modal-gc-section">Identificación</div>
    <div class="row g-2 mb-3">
        <div class="col-3">
            <label class="modal-gc-label" for="editCodigo">Código</label>
            <input type="text" name="codigo" id="editCodigo" class="form-control" value="{{ vendedor.codigo }}" required>
        </div>
        <div class="col-6">
            <label class="modal-gc-label" for="editNombre">Nombre</label>
            <input type="text" name="nombre" id="editNombre" class="form-control" value="{{ vendedor.nombre }}" required>
        </div>
        <div class="col-3">
            <label class="modal-gc-label" for="editComision">Comisión %</label>
            <input type="number" name="porcentaje_comision" id="editComision" class="form-control" min="0" max="100" step="0.01" value="{{ vendedor.porcentaje_comision|unlocalize }}">
        </div>
    </div>
    <div class="modal-gc-panel">
        <div class="modal-gc-section">Acceso app móvil</div>
        <p class="modal-gc-hint">El vendedor entra a la app con este celular. Sin número activo no puede vender.</p>
        <label class="modal-gc-label" for="editTelefono">Celular</label>
        <input type="text" name="telefono_app" id="editTelefono" class="form-control mb-2" value="{{ vendedor.telefono_app_display }}" placeholder="+56 9 1234 5678" autocomplete="off">
        <label class="modal-gc-check">
            <input type="checkbox" name="app_movil_activa" id="appMovilEditar"{% if vendedor.app_movil_activa %} checked{% endif %}>
            <span>Permitir ventas desde la app</span>
        </label>
        <label class="modal-gc-check">
            <input type="checkbox" name="activo" id="activoEditar"{% if vendedor.activo %} checked{% endif %}>
            <span>Vendedor activo en el sistema</span>
        </label>
    </div>
</form>
