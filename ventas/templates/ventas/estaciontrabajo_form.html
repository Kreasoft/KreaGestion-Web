<form method="post" action="{% url 'ventas:estaciontrabajo_edit' estacion.pk %}" id="formEditarEstacionSubmit">
    {% csrf_token %}
    {% include "ventas/_estaciontrabajo_campos.html" %}
</form>
<script>
(function () {
    var form = document.getElementById('formEditarEstacionSubmit');
    if (!form) return;
    var chk = form.querySelector('[data-est-cierre]');
    var extras = form.querySelector('.est-cierre-extras');
    if (!chk || !extras) return;
    function sync() { extras.classList.toggle('is-off', !chk.checked); }
    chk.addEventListener('change', sync);
    sync();
})();
</script>
