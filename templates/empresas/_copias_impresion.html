<div class="d-flex align-items-center gap-2 mt-2">
    <label class="small mb-0 fw-bold" for="{{ name }}" style="color: #5D4037;">Copias</label>
    <input type="number" name="{{ name }}" id="{{ name }}" min="1" max="10" step="1"
           value="{{ value|default:1 }}"
           class="form-control form-control-sm"
           style="width: 4.6rem; border-color: #E8DCC8; color: #5D4037;">
</div>
