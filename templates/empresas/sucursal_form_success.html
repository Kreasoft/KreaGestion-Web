<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Sucursal guardada</title>
    <style>
        body {
            margin: 0;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background: #FAFAF8;
            color: #5D4037;
        }
        .ok {
            text-align: center;
            padding: 1.5rem;
        }
        .ok i { color: #5F8D62; font-size: 1.6rem; }
        .ok p { margin: 0.75rem 0 0; font-size: 0.95rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="ok">
        <p>{{ mensaje }}</p>
        <p style="font-weight:500;opacity:.75;font-size:.8rem;">Cerrando...</p>
    </div>
    <script>
        (function () {
            var origen = window.location.origin;
            var payload = { type: 'sucursalGuardada' };
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, origen);
            } else {
                window.location.replace("{% url 'empresas:sucursal_list' %}");
            }
        })();
    </script>
</body>
</html>
