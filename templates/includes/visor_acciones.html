<!-- VISOR_ACCIONES_START -->
<style>
@media print {
    .visor-actions { display: none !important; }
}
@media screen {
    body { padding-top: 88px !important; }
}
.visor-actions {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100vw;
    max-width: none;
    margin: 0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px 16px;
    background: #5D4037;
    border-bottom: 3px solid #C76F43;
    box-shadow: 0 2px 10px rgba(93, 64, 55, 0.28);
}
.visor-actions button {
    padding: 12px 28px;
    min-height: 44px;
    min-width: 120px;
    font-size: 16px !important;
    font-weight: 700;
    font-family: system-ui, "Segoe UI", sans-serif;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    transition: background-color 0.2s, opacity 0.2s;
}
.visor-actions button:disabled {
    opacity: 0.7;
    cursor: wait;
}
.visor-actions .btn-imprimir { background: #5F8D62; }
.visor-actions .btn-imprimir:hover { background: #4e7751; }
.visor-actions .btn-volver { background: #8B7355; }
.visor-actions .btn-volver:hover { background: #756147; }
.visor-actions .btn-cerrar { background: #C76F43; }
.visor-actions .btn-cerrar:hover { background: #a85a34; }
.visor-actions .visor-feedback {
    display: inline-block;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 4px;
    color: #fff;
}
</style>

<div class="no-print visor-actions" role="toolbar" aria-label="Acciones del documento">
    <input type="hidden" id="visorCsrfToken" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <button type="button" id="btnImprimirVisor" class="btn-imprimir" onclick="visorImprimirAgente()">Imprimir</button>
    <button type="button" class="btn-volver" onclick="visorAccionCerrar()">Volver</button>
    <button type="button" id="btnCerrar" class="btn-cerrar" onclick="visorAccionCerrar()">Cerrar</button>
    <span id="visorFeedback" class="visor-feedback" style="display: none;"></span>
</div>

<script>
function visorAccionCerrar() {
    if (typeof safeCloseWindow === 'function') { safeCloseWindow(); return; }
    if (typeof cerrarVentana === 'function') { cerrarVentana(); return; }
    if (typeof cerrarVisor === 'function') { cerrarVisor(); return; }
    if (window.history.length > 1) { window.history.back(); return; }
    window.location.href = '/';
}

function getVisorCsrfToken() {
    var el = document.getElementById('visorCsrfToken');
    if (el && el.value) return el.value;
    var name = 'csrftoken';
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue || '';
}

function mostrarFeedbackVisor(mensaje, tipo) {
    var fb = document.getElementById('visorFeedback');
    if (!fb) return;
    fb.textContent = mensaje;
    fb.style.display = 'inline-block';
    if (tipo === 'success') {
        fb.style.backgroundColor = '#2e7d32';
    } else if (tipo === 'warning') {
        fb.style.backgroundColor = '#e65100';
    } else if (tipo === 'info') {
        fb.style.backgroundColor = '#1565c0';
    } else {
        fb.style.backgroundColor = '#c62828';
    }
    if (tipo === 'success') {
        setTimeout(function() {
            if (fb) fb.style.display = 'none';
        }, 4000);
    }
}

function visorImprimirAgente() {
    var btn = document.getElementById('btnImprimirVisor');
    var dteId = "{{ dte.id|default:'' }}";
    var ventaId = "{{ venta.id|default:'' }}";
    var empresaId = "{% if empresa.id %}{{ empresa.id }}{% elif venta.empresa_id %}{{ venta.empresa_id }}{% elif dte and dte.empresa_id %}{{ dte.empresa_id }}{% endif %}";

    // Si no hay ID de documento para el agente, usar impresión nativa
    if (!dteId && !ventaId) {
        window.print();
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.dataset.originalText = btn.textContent;
        btn.textContent = 'Enviando al agente...';
    }
    mostrarFeedbackVisor('Enviando documento a la cola del agente...', 'info');

    var url = dteId 
        ? ('/facturacion-electronica/dte/' + dteId + '/imprimir-agente/')
        : ('/ventas/vales/' + ventaId + '/imprimir-agente/');

    var postData = 'empresa_id=' + encodeURIComponent(empresaId);

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getVisorCsrfToken()
        },
        body: postData
    })
    .then(function(response) {
        return response.json().then(function(data) {
            return { status: response.status, data: data };
        });
    })
    .then(function(res) {
        var data = res.data;
        if (data && data.success) {
            if (btn) {
                btn.textContent = 'Imprimiendo...';
                btn.style.backgroundColor = '#2e7d32';
            }
            mostrarFeedbackVisor('Enviado a impresora. Esperando confirmación...', 'info');

            // Sondear estado del trabajo hasta confirmación
            var trabajoId = data.trabajo_id;
            if (trabajoId) {
                var intentos = 0;
                var maxIntentos = 10; // ~15 segundos
                var intervalo = setInterval(function() {
                    intentos++;
                    var pollUrl = (dteId 
                        ? ('/facturacion-electronica/dte/' + dteId + '/imprimir-agente/?trabajo_id=' + trabajoId)
                        : ('/ventas/vales/' + ventaId + '/imprimir-agente/?trabajo_id=' + trabajoId));
                    
                    fetch(pollUrl)
                    .then(function(r) { return r.json(); })
                    .then(function(pollData) {
                        if (pollData && pollData.estado === 'impreso') {
                            clearInterval(intervalo);
                            if (btn) {
                                btn.textContent = '✓ Impreso';
                                btn.style.backgroundColor = '#2e7d32';
                            }
                            mostrarFeedbackVisor('✓ Impreso exitosamente con el agente local.', 'success');
                            setTimeout(function() {
                                if (btn) {
                                    btn.textContent = 'Imprimir';
                                    btn.style.backgroundColor = '#5F8D62';
                                    btn.disabled = false;
                                }
                            }, 3000);
                        } else if (pollData && pollData.estado === 'error') {
                            clearInterval(intervalo);
                            if (btn) {
                                btn.textContent = 'Error';
                                btn.style.backgroundColor = '#C76F43';
                            }
                            mostrarFeedbackVisor(pollData.message || 'El agente reportó un error al imprimir.', 'error');
                            setTimeout(function() {
                                if (btn) {
                                    btn.textContent = 'Imprimir';
                                    btn.style.backgroundColor = '#5F8D62';
                                    btn.disabled = false;
                                }
                            }, 3000);
                        } else if (intentos >= maxIntentos) {
                            clearInterval(intervalo);
                            if (btn) {
                                btn.textContent = '✓ En cola';
                                btn.style.backgroundColor = '#5F8D62';
                                btn.disabled = false;
                            }
                            mostrarFeedbackVisor('El documento quedó en cola para impresión.', 'info');
                            setTimeout(function() {
                                if (btn) btn.textContent = 'Imprimir';
                            }, 3000);
                        }
                    })
                    .catch(function() {
                        clearInterval(intervalo);
                        if (btn) {
                            btn.textContent = 'Imprimir';
                            btn.style.backgroundColor = '#5F8D62';
                            btn.disabled = false;
                        }
                    });
                }, 1500);
            } else {
                if (btn) {
                    btn.textContent = '✓ Impreso';
                    btn.disabled = false;
                }
            }
        } else {
            // Manejo de error o agente desconectado
            if (btn) {
                btn.textContent = 'Imprimir';
                btn.style.backgroundColor = '#5F8D62';
                btn.disabled = false;
            }
            if (data && data.agente_desconectado) {
                mostrarFeedbackVisor('Agente de impresión desconectado.', 'warning');
                var usarNavegador = confirm((data.message || 'El agente de impresión local no está conectado.') + '\n\n¿Desea imprimir usando el navegador?');
                if (usarNavegador) {
                    window.print();
                }
            } else {
                var msg = (data && data.message) ? data.message : 'No se pudo enviar la impresión al agente.';
                mostrarFeedbackVisor(msg, 'error');
                alert(msg);
            }
        }
    })
    .catch(function(err) {
        if (btn) {
            btn.textContent = 'Imprimir';
            btn.style.backgroundColor = '#5F8D62';
            btn.disabled = false;
        }
        mostrarFeedbackVisor('Error de conexión al intentar imprimir con el agente.', 'error');
        var fallback = confirm('Error al conectar con el servidor para imprimir con el agente.\n\n¿Desea imprimir con el navegador?');
        if (fallback) {
            window.print();
        }
    });
}
</script>
<!-- VISOR_ACCIONES_END -->
