<style>
@media print {
    .visor-actions { display: none !important; }
}
@media screen {
    body { padding-top: 64px !important; }
}
.visor-actions {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100vw;
    max-width: none;
    margin: 0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px 16px;
    background: #5D4037;
    border-bottom: 3px solid #C76F43;
    box-shadow: 0 2px 10px rgba(93, 64, 55, 0.28);
}
.visor-actions button {
    padding: 12px 28px;
    min-height: 44px;
    min-width: 120px;
    font-size: 16px !important;
    font-weight: 700;
    font-family: system-ui, "Segoe UI", sans-serif;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
}
.visor-actions .btn-imprimir { background: #5F8D62; }
.visor-actions .btn-volver { background: #8B7355; }
.visor-actions .btn-cerrar { background: #C76F43; }
</style>
<div class="no-print visor-actions" role="toolbar" aria-label="Acciones del documento">
    <button type="button" class="btn-imprimir" onclick="window.print()">Imprimir</button>
    <button type="button" class="btn-volver" onclick="visorAccionCerrar()">Volver</button>
    <button type="button" id="btnCerrar" class="btn-cerrar" onclick="visorAccionCerrar()">Cerrar</button>
</div>
<script>
function visorAccionCerrar() {
    if (typeof safeCloseWindow === 'function') { safeCloseWindow(); return; }
    if (typeof cerrarVentana === 'function') { cerrarVentana(); return; }
    if (typeof cerrarVisor === 'function') { cerrarVisor(); return; }
    if (window.history.length > 1) { window.history.back(); return; }
    window.location.href = '/';
}
</script>
