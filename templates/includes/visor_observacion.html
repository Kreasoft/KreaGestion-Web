{% load format_filters %}
{% firstof observacion venta.observaciones nota.observaciones transferencia.observaciones "" as raw_obs %}
{% with obs=raw_obs|glosa_visible %}
{% if obs %}
<style>
    .visor-observacion {
        margin: 10px 0 12px 0;
        padding: 7px 10px;
        border: 1px solid #E8DCC8;
        background: #FAFAF8;
        color: #5D4037;
        font-size: 8pt;
        line-height: 1.4;
        letter-spacing: 0.01em;
    }
    .visor-observacion strong {
        display: block;
        margin: 0 0 4px 0;
        font-size: 7.5pt;
        letter-spacing: 0.04em;
    }
    .visor-observacion p {
        margin: 0;
        white-space: pre-wrap;
        word-spacing: 0.08em;
    }
</style>
<div class="visor-observacion">
    <strong>Observación</strong>
    <p>{{ obs }}</p>
</div>
{% endif %}
{% endwith %}
