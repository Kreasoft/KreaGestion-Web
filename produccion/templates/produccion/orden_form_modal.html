<style>

    .stone-header-premium { padding: 8px 16px !important; border-bottom: 2px solid #D4C4A8 !important; }
    .header-icon-box { width: 34px !important; height: 34px !important; font-size: 0.95rem !important; border-radius: 8px !important; }
    .header-text h1 { font-size: 1.45rem !important; color: var(--color-piedra-texto, #5D4037) !important; }
    .header-text p { font-size: 0.75rem !important; }
    .stat-card { min-height: 52px !important; }
    .stat-content { padding: 6px 10px !important; }
    .stat-value { font-size: 1.15rem !important; }
    .stat-icon-full { font-size: 2rem !important; }
    .stat-icon { font-size: 1.6rem !important; }
    .stone-filter-box { padding: 8px 10px !important; margin-bottom: 8px !important; border-radius: 8px !important; }
    .form-control-stone, .form-select-stone,
    input[type="text"], input[type="number"], input[type="date"], textarea, select,
    .form-control, .form-select {
        padding: 2px 8px !important; font-size: 0.75rem !important; min-height: 26px !important; height: 28px !important;
        border: 1px solid #D4C4A8 !important; border-radius: 6px !important;
    }
    textarea.form-control, textarea.form-control-stone, textarea { height: auto !important; min-height: 52px !important; }
    .form-control-stone:focus, .form-select-stone:focus,
    input:focus, textarea:focus, select:focus, .form-control:focus, .form-select:focus {
        border-color: #6F5B44 !important; box-shadow: 0 0 0 2px rgba(111,91,68,0.18) !important; outline: none !important;
    }
    .form-check-input:checked { background-color: #6F5B44 !important; border-color: #6F5B44 !important; }
    .form-check-input:focus { box-shadow: 0 0 0 0.2rem rgba(111,91,68,0.25) !important; border-color: #6F5B44 !important; }
    .btn-action-primary, .header-btn.btn-action-primary {
        background: var(--color-verde-oliva, #8B8B3A) !important; border: 1px solid #6F6F2E !important; color: #fff !important;
        font-size: 0.75rem !important; font-weight: 700 !important; padding: 4px 12px !important;
    }
    .header-btn { font-size: 0.75rem !important; padding: 4px 10px !important; color: #5D4037 !important; }
    .modal-header, .modal-header-stone, .stone-modal-header { padding: 8px 16px !important; }
    .modal-body { padding: 8px 12px !important; }
    .single-card-container { margin-top: 0 !important; margin-bottom: 8px !important; }
    .table-piedra tbody tr { height: 32px !important; }
    .table-piedra tbody td { padding: 2px 8px !important; font-size: 0.75rem !important; }
    .table-piedra thead th { padding: 6px 8px !important; font-size: 0.65rem !important; }
</style>
<div class="modal-header stone-modal-header" style="background: linear-gradient(135deg, #efebe9 0%, #d7ccc8 100%); padding: 8px 16px; border-bottom: 1px solid #E8DCC8; border-radius: 16px 16px 0 0;">
    <div class="d-flex align-items-center gap-3">
        <div class="header-icon-box" style="width: 34px; height: 34px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(4px); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(139, 115, 85, 0.15); color: #6F5B44; font-size: 1.25rem;">
            <i class="fas fa-industry"></i>
        </div>
        <div>
            <h5 class="modal-title fw-bold" style="color: #5D4037; font-size: 1.1rem; letter-spacing: -0.5px; margin: 0;">{% if orden %}Editar{% else %}Nueva{% endif %} Orden de Producción</h5>
            <p class="mb-0 text-muted" style="font-size: 0.8rem;">{% if orden %}Modificar datos de la orden{% else %}Planificar una nueva orden de fabricación{% endif %}</p>
        </div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body" style="padding: 8px 12px !important;" style="background: white;">
    
    <!-- Mensajes de error/info -->
    <div id="modal-messages">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <form id="ordenFormModal" method="post" action="{% if orden and orden.pk %}{% url 'produccion:orden_update' orden.pk %}{% else %}{% url 'produccion:orden_create' %}{% endif %}">
        {% csrf_token %}
        <input type="hidden" name="orden_id" value="{{ orden.pk|default:'' }}">
        
        <div class="row g-1">
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted mb-1">Número de Orden <span class="text-danger">*</span></label>
                <input type="text" name="numero_orden" class="form-control form-control-stone" value="{{ orden.numero_orden|default:'' }}" placeholder="Ej: OP-2025-001" required style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
            </div>
            
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted mb-1">Lote Producción</label>
                <input type="text" name="lote_produccion" class="form-control form-control-stone" value="{{ orden.lote_produccion|default:'' }}" placeholder="Ej: LOTE-2025-001" style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
            </div>

            <div class="col-md-12">
                <label class="form-label small fw-bold text-muted mb-1">Receta <span class="text-danger">*</span></label>
                <select name="receta" class="form-select form-select-stone" required style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
                    <option value="">Seleccione una receta...</option>
                    {% for receta in recetas %}
                    <option value="{{ receta.id }}" {% if orden and orden.receta_id == receta.id %}selected{% endif %}>{{ receta.codigo }} - {{ receta.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted mb-1">Cantidad a Producir <span class="text-danger">*</span></label>
                <input type="number" name="cantidad_planificada" class="form-control form-control-stone" value="{{ orden.cantidad_planificada|default:'1' }}" step="0.01" min="0" required style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted mb-1">Bodega <span class="text-danger">*</span></label>
                <select name="bodega" class="form-select form-select-stone" required style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
                    <option value="">Seleccione bodega...</option>
                    {% for bodega in bodegas %}
                    <option value="{{ bodega.id }}" {% if orden and orden.bodega_id == bodega.id %}selected{% endif %}>{{ bodega.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted mb-1">Fecha Planificada <span class="text-danger">*</span></label>
                <input type="date" name="fecha_planificada" class="form-control form-control-stone" value="{{ orden.fecha_planificada|date:'Y-m-d' }}" required style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted mb-1">Responsable</label>
                <input type="text" name="responsable" class="form-control form-control-stone" value="{{ orden.responsable|default:'' }}" placeholder="Nombre del responsable" style="height: 28px; font-size: 0.75rem; padding: 2px 8px;">
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold text-muted mb-1">Observaciones</label>
                <textarea name="observaciones" class="form-control form-control-stone" rows="2" placeholder="Notas adicionales..." style="font-size: 0.85rem;">{{ orden.observaciones|default:'' }}</textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-2 pt-2 border-top border-light">
            <button type="button" class="btn btn-light border" data-bs-dismiss="modal" style="font-size: 0.85rem; font-weight: 500; color: #5D4037;">Cancelar</button>
            <button type="submit" class="btn text-white" style="background: linear-gradient(135deg, #8B7355 0%, #6F5B44 100%); font-size: 0.85rem; font-weight: 500; border: none;">
                <i class="fas fa-save me-2"></i>Guardar Orden
            </button>
        </div>
    </form>
</div>
