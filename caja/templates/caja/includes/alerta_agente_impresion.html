{% if alerta_agente_impresion %}
<div class="d-flex align-items-center gap-2 mb-2 px-3 py-2" style="background:#F5E6D8; border:1px solid #C76F43; border-radius:8px; color:#5D4037;">
    <i class="fas fa-print" style="color:#C76F43;"></i>
    <div class="flex-grow-1" style="font-size:0.8rem; line-height:1.3;">
        <strong>La impresora no está en línea.</strong>
        Abra el programa Impresora GestionCloud en este computador. No hay que configurar de nuevo. Si no, no se imprimirán los documentos.
    </div>
</div>
{% if alerta_agente_modal %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    if (typeof Swal === 'undefined') return;
    Swal.fire({
        icon: 'warning',
        iconColor: '#C76F43',
        title: 'La impresora no está en línea',
        html: 'Abra el programa Impresora GestionCloud en este computador. No hay que configurar de nuevo. Puede seguir cobrando; los documentos no se imprimirán hasta que el programa esté abierto.',
        confirmButtonText: 'Entendido',
        confirmButtonColor: '#C76F43'
    });
});
</script>
{% endif %}
{% endif %}
