<form id="vehiculo-form" method="post" action="{% if vehiculo %}{% url 'pedidos:vehiculo_update' vehiculo.pk %}{% else %}{% url 'pedidos:vehiculo_create' %}{% endif %}" novalidate>
    {% csrf_token %}
    <div class="row g-2">
        <div class="col-12">
            <label for="{{ form.patente.id_for_label }}" class="form-label fw-bold mb-0" style="font-size: 0.72rem; color: #6F5B44;">Patente *</label>
            {{ form.patente }}
        </div>
        <div class="col-12">
            <label for="{{ form.descripcion.id_for_label }}" class="form-label fw-bold mb-0" style="font-size: 0.72rem; color: #6F5B44;">Descripción *</label>
            {{ form.descripcion }}
        </div>
        <div class="col-md-6">
            <label for="{{ form.capacidad.id_for_label }}" class="form-label fw-bold mb-0" style="font-size: 0.72rem; color: #6F5B44;">Capacidad (kg)</label>
            {{ form.capacidad }}
        </div>
        <div class="col-md-6">
            <label for="{{ form.chofer.id_for_label }}" class="form-label fw-bold mb-0" style="font-size: 0.72rem; color: #6F5B44;">Chofer</label>
            {{ form.chofer }}
        </div>
        <div class="col-12">
            <div class="form-check">
                {{ form.activo }}
                <label class="form-check-label" for="{{ form.activo.id_for_label }}" style="font-size: 0.75rem; color: #6F5B44;">Activo</label>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-2">
        <button type="button" class="btn btn-sm" data-bs-dismiss="modal" style="color:#5D4037; font-weight:600;">Cancelar</button>
        <button type="submit" class="btn btn-sm" style="background: var(--color-verde-oliva, #8B8B3A); border: 1px solid #6F6F2E; color:#fff; font-weight:700;">
            <i class="fas fa-save me-1"></i> Guardar
        </button>
    </div>
</form>
<script>
(function() {
    document.querySelectorAll('#vehiculo-form input, #vehiculo-form select').forEach(function(el) {
        if (el.type === 'hidden' || el.type === 'checkbox') return;
        el.classList.add('form-control', 'form-control-sm');
        el.style.fontSize = '0.75rem';
        el.style.height = '28px';
        el.style.borderColor = '#D4C4A8';
    });
})();
</script>
