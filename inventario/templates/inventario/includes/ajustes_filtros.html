<div class="py-2 px-2 mb-2" style="background: #FAFAF8; border: 1px solid #E8DCC8; border-radius: 6px;">
    <form method="get" class="row g-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label small fw-bold mb-0" style="color: #6F5B44; font-size: 0.72rem;">Bodega</label>
            <select name="bodega" class="form-select form-select-sm" style="border-color: #D4C4A8; font-size: 0.75rem;">
                <option value="">Todas las bodegas</option>
                {% for bod in bodegas %}
                <option value="{{ bod.id }}" {% if request.GET.bodega == bod.id|stringformat:"s" %}selected{% endif %}>
                    {{ bod.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label small fw-bold mb-0" style="color: #6F5B44; font-size: 0.72rem;">Desde</label>
            <input type="date" name="fecha_desde" class="form-control form-control-sm" value="{{ request.GET.fecha_desde }}" style="border-color: #D4C4A8; font-size: 0.75rem;">
        </div>
        <div class="col-md-2">
            <label class="form-label small fw-bold mb-0" style="color: #6F5B44; font-size: 0.72rem;">Hasta</label>
            <input type="date" name="fecha_hasta" class="form-control form-control-sm" value="{{ request.GET.fecha_hasta }}" style="border-color: #D4C4A8; font-size: 0.75rem;">
        </div>
        <div class="col-md-2">
            <label class="form-label small fw-bold mb-0" style="color: #6F5B44; font-size: 0.72rem;">Tipo</label>
            <select name="tipo" class="form-select form-select-sm" style="border-color: #D4C4A8; font-size: 0.75rem;">
                <option value="">Todos</option>
                <option value="entrada" {% if request.GET.tipo == 'entrada' %}selected{% endif %}>Entradas</option>
                <option value="salida" {% if request.GET.tipo == 'salida' %}selected{% endif %}>Salidas</option>
            </select>
        </div>
        <div class="col-md-3">
            <div class="d-flex gap-1">
                <button type="submit" class="btn btn-sm" style="background: #8B7355; color: white; font-size: 0.75rem; border: none;">
                    <i class="fas fa-filter me-1"></i> Filtrar
                </button>
                <a href="{% url 'inventario:ajustes_list' %}" class="btn btn-sm" style="border: 1px solid #D4C4A8; color: #5D4037; font-size: 0.75rem;">
                    <i class="fas fa-times me-1"></i> Limpiar
                </a>
            </div>
        </div>
    </form>
</div>
