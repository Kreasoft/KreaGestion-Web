<style>
    .ajuste-doc {
        font-family: 'Poppins', sans-serif;
        background: #FAFAF8;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #E8DCC8;
    }
    .ajuste-doc .ajuste-doc-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: linear-gradient(135deg, #EFEBE9 0%, #E8DCC8 100%);
        border-bottom: 1px solid #D4C4A8;
    }
    .ajuste-doc .ajuste-doc-icon {
        width: 36px; height: 36px; flex: 0 0 36px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #D4C4A8;
        color: #6F5B44;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.95rem;
    }
    .ajuste-doc .ajuste-doc-header h5 {
        margin: 0; color: #5D4037; font-size: 0.98rem; font-weight: 650; line-height: 1.2;
    }
    .ajuste-doc .ajuste-doc-header p {
        margin: 0; color: #8B7355; font-size: 0.68rem; font-weight: 500;
    }
    .ajuste-doc .ajuste-doc-body { padding: 10px 14px 8px; }
    .ajuste-doc .form-label-premium {
        font-size: 0.62rem; font-weight: 700; color: #8B7355;
        text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px;
    }
    .ajuste-doc .form-control-premium {
        height: 28px !important; min-height: 28px !important;
        border-radius: 4px; border: 1px solid #D4C4A8; padding: 2px 8px; font-size: 0.75rem; color: #5D4037;
        accent-color: #6F5B44;
    }
    .ajuste-doc .form-control-premium:focus {
        border-color: #6F5B44 !important; box-shadow: 0 0 0 0.15rem rgba(111, 91, 68, 0.18) !important; outline: none;
    }
    .ajuste-doc .ajuste-ficha {
        background: #fff;
        border: 1px solid #E8DCC8;
        border-radius: 8px;
        padding: 8px 10px 10px;
        margin-bottom: 8px;
    }
    .ajuste-doc .ajuste-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        background: #F7F1E8;
        border-bottom: 1px solid #E8DCC8;
    }
    .ajuste-doc .ajuste-toolbar-title {
        font-size: 0.68rem; font-weight: 700; color: #6F5B44;
        text-transform: uppercase; letter-spacing: 0.5px;
    }
    .ajuste-doc .details-panel {
        background: #fff;
        border: 1px solid #E8DCC8;
        border-radius: 8px;
        overflow: hidden;
    }
    .ajuste-doc .btn-remove-edit {
        width: 22px; height: 22px; padding: 0;
        color: #C76F43; border: 1px solid #E8DCC8; background: #fff;
        border-radius: 4px;
        line-height: 20px;
    }
    .ajuste-doc .ajuste-doc-footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 12px;
        border-top: 1px solid #E8DCC8;
        background: #FAFAF8;
    }
    .ajuste-doc .btn-doc-cancel {
        height: 30px; padding: 0 12px; border: 1px solid #D4C4A8;
        background: #fff; color: #5D4037; font-size: 0.75rem; font-weight: 600; border-radius: 5px;
    }
    .ajuste-doc .btn-doc-save {
        height: 30px; padding: 0 14px; background: #8B8B3A; border: 1px solid #6F6F2E;
        color: #fff; font-size: 0.75rem; font-weight: 700; border-radius: 5px;
    }
    .ajuste-doc .btn-doc-save:hover { background: #7A7A32; color: #fff; }
</style>

<div class="ajuste-doc">
<div class="ajuste-doc-header">
    <div class="ajuste-doc-icon"><i class="fas fa-pen"></i></div>
    <div class="flex-grow-1">
        <h5>Editar ajuste {{ ajuste.numero_folio }}</h5>
        <p>Modifique el movimiento y el detalle de artículos</p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="ajuste-doc-body">
    <form method="post" id="ajusteFormEdit" action="{% url 'inventario:ajuste_edit_simple' ajuste.pk %}">
        {% csrf_token %}
        <input type="hidden" name="detalles_data" id="detalles_data_edit">

        <div class="ajuste-ficha">
            <div class="row g-2">
                <div class="col-6 col-lg-3">
                    <label class="form-label-premium">Tipo</label>
                    <select name="tipo_ajuste" id="tipo_ajuste_edit" class="form-select form-control-premium" required>
                        <option value="ENTRADA" {% if ajuste.tipo_ajuste == 'entrada' %}selected{% endif %}>Entrada (+ stock)</option>
                        <option value="SALIDA" {% if ajuste.tipo_ajuste == 'salida' %}selected{% endif %}>Salida (− stock)</option>
                    </select>
                </div>
                <div class="col-6 col-lg-2">
                    <label class="form-label-premium">Fecha</label>
                    <input type="date" name="fecha_ajuste" class="form-control form-control-premium" required value="{{ ajuste.fecha_ajuste|date:'Y-m-d' }}">
                </div>
                <div class="col-6 col-lg-3">
                    <label class="form-label-premium">Bodega</label>
                    <select name="bodega" id="bodega_edit" class="form-select form-control-premium" required>
                        {% for bodega in bodegas %}
                            <option value="{{ bodega.id }}" {% if bodega.id == ajuste.bodega.id %}selected{% endif %}>{{ bodega.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6 col-lg-4">
                    <label class="form-label-premium">Motivo</label>
                    <input type="text" name="descripcion" class="form-control form-control-premium" required value="{{ ajuste.descripcion }}">
                </div>
            </div>
        </div>

        <div class="details-panel">
            <div class="ajuste-toolbar">
                <div class="ajuste-toolbar-title">Detalle <span id="edit-count-label" style="font-weight:600;color:#8B7355;text-transform:none;">({{ detalles_edit|length }})</span></div>
                <button type="button" class="btn btn-sm btn-articulos-f10" data-articulos-f10 title="Buscar artículos (F10)">
                    <i class="fas fa-search me-1"></i>F10
                </button>
            </div>
            <div class="p-2 bg-white" style="max-height: 280px; overflow-y: auto;">
                <div id="detallesContainerEdit">
                    {% for d in detalles_edit %}
                    <div class="row g-1 align-items-center detalle-item-edit mb-1">
                        <div class="col-12 col-md-5">
                            <select class="form-select form-select-sm articulo-select-edit form-control-premium" required>
                                <option value="{{ d.articulo_id }}" selected>{{ d.codigo }} - {{ d.nombre }}</option>
                            </select>
                        </div>
                        <div class="col-5 col-md-2">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text cantidad-sign-edit fw-bold text-white px-2"
                                      style="background: {% if ajuste.tipo_ajuste == 'entrada' %}#5F8D62{% else %}#C76F43{% endif %}; border:none; height:28px;">
                                    {% if ajuste.tipo_ajuste == 'entrada' %}+{% else %}-{% endif %}
                                </span>
                                <input type="number" class="form-control form-control-premium cant-edit" value="{{ d.cantidad_str }}" step="0.01" min="0.01" required style="font-weight: 600;">
                            </div>
                        </div>
                        <div class="col-5 col-md-4">
                            <input type="text" class="form-control form-control-sm form-control-premium com-edit" value="{{ d.comentario }}" placeholder="Nota opcional">
                        </div>
                        <div class="col-2 col-md-1 text-end">
                            <button type="button" class="btn btn-sm btn-remove-edit" title="Quitar"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <button type="button" id="btnAddDetalleEdit" class="btn w-100" style="background:#FAFAF8;color:#8B7355;border:none;border-top:1px solid #E8DCC8;font-size:0.72rem;font-weight:600;padding:6px;">
                <i class="fas fa-plus me-1"></i>Agregar artículo
            </button>
        </div>
    </form>
</div>

<div class="ajuste-doc-footer">
    <button type="button" class="btn-doc-cancel" data-bs-dismiss="modal">Cancelar</button>
    <button type="button" class="btn-doc-save" id="btnGuardarEdit">
        <i class="fas fa-save me-1"></i>Guardar cambios
    </button>
</div>
</div>

<script>
(function() {
    let articulosCache = [];
    const form = document.getElementById('ajusteFormEdit');
    if (!form) return;
    const container = document.getElementById('detallesContainerEdit');
    const tipoSelect = document.getElementById('tipo_ajuste_edit');
    const bodegaSelect = document.getElementById('bodega_edit');

    function actualizarContador() {
        const n = container.querySelectorAll('.detalle-item-edit').length;
        const label = document.getElementById('edit-count-label');
        if (label) label.textContent = '(' + n + ')';
    }

    function signoHtml() {
        const isEntrada = tipoSelect.value === 'ENTRADA';
        return '<span class="input-group-text cantidad-sign-edit fw-bold text-white px-2" style="background:' +
            (isEntrada ? '#5F8D62' : '#C76F43') + ';border:none;height:28px;">' +
            (isEntrada ? '+' : '-') + '</span>';
    }

    function opcionesArticulo(selectedId) {
        let html = '<option value="">Seleccione artículo...</option>';
        articulosCache.forEach(function (art) {
            const sel = String(art.id) === String(selectedId) ? ' selected' : '';
            html += '<option value="' + art.id + '"' + sel + '>' + art.codigo + ' - ' + art.nombre + '</option>';
        });
        return html;
    }

    function filaHtml(articuloId, cantidad, comentario) {
        const wrap = document.createElement('div');
        wrap.className = 'row g-1 align-items-center detalle-item-edit mb-1';
        wrap.innerHTML =
            '<div class="col-12 col-md-5"><select class="form-select form-select-sm articulo-select-edit form-control-premium" required>' +
            opcionesArticulo(articuloId || '') + '</select></div>' +
            '<div class="col-5 col-md-2"><div class="input-group input-group-sm">' + signoHtml() +
            '<input type="number" class="form-control form-control-premium cant-edit" value="' + (cantidad || '') + '" step="0.01" min="0.01" required style="font-weight:600;"></div></div>' +
            '<div class="col-5 col-md-4"><input type="text" class="form-control form-control-sm form-control-premium com-edit" value="' + (comentario || '') + '" placeholder="Nota opcional"></div>' +
            '<div class="col-2 col-md-1 text-end"><button type="button" class="btn btn-sm btn-remove-edit" title="Quitar" style="width:24px;height:24px;padding:0;color:#C76F43;border:1px solid #E8DCC8;background:#fff;"><i class="fas fa-times"></i></button></div>';
        return wrap;
    }

    function actualizarSelects() {
        container.querySelectorAll('.articulo-select-edit').forEach(function (select) {
            const currentVal = select.value;
            const currentText = select.options[select.selectedIndex] ? select.options[select.selectedIndex].text : '';
            select.innerHTML = opcionesArticulo(currentVal);
            if (currentVal && !select.value && currentText) {
                const opt = document.createElement('option');
                opt.value = currentVal;
                opt.textContent = currentText;
                opt.selected = true;
                select.insertBefore(opt, select.firstChild);
            }
            if (currentVal) select.value = currentVal;
        });
    }

    function actualizarSignos() {
        const isEntrada = tipoSelect.value === 'ENTRADA';
        container.querySelectorAll('.cantidad-sign-edit').forEach(function (span) {
            span.textContent = isEntrada ? '+' : '-';
            span.style.background = isEntrada ? '#5F8D62' : '#C76F43';
        });
    }

    function cargarArticulosDeBodega(bodegaId) {
        if (!bodegaId) return;
        fetch('/inventario/api/articulos-ajuste/?bodega_id=' + bodegaId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                articulosCache = data.articulos || [];
                actualizarSelects();
            });
    }

    function agregarFila() {
        container.appendChild(filaHtml('', '', ''));
        actualizarContador();
    }
    window.agregarFilaAjusteEdit = agregarFila;

    bodegaSelect.addEventListener('change', function () {
        cargarArticulosDeBodega(this.value);
    });
    tipoSelect.addEventListener('change', actualizarSignos);
    document.getElementById('btnAddDetalleEdit').addEventListener('click', agregarFila);
    container.addEventListener('click', function (e) {
        const btn = e.target.closest('.btn-remove-edit');
        if (!btn) return;
        const rows = container.querySelectorAll('.detalle-item-edit');
        if (rows.length <= 1) return;
        btn.closest('.detalle-item-edit').remove();
        actualizarContador();
    });
    document.getElementById('btnGuardarEdit').addEventListener('click', function () {
        const detalles = [];
        container.querySelectorAll('.detalle-item-edit').forEach(function (item) {
            const selArt = item.querySelector('.articulo-select-edit');
            const art = String((selArt && (selArt.getAttribute('data-articulo-id') || selArt.value)) || '').replace(/\D/g, '');
            const cant = parseFloat(item.querySelector('.cant-edit').value) || 0;
            const com = item.querySelector('.com-edit').value || '';
            if (art && cant > 0) {
                detalles.push({ articulo_id: parseInt(art, 10), cantidad: cant, comentario: com });
            }
        });
        if (detalles.length === 0) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Agregue al menos un artículo con cantidad válida', confirmButtonColor: '#8B7355' });
            return;
        }
        document.getElementById('detalles_data_edit').value = JSON.stringify(detalles);
        const btn = document.getElementById('btnGuardarEdit');
        const originalContent = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Guardando...';
        fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.success) {
                Swal.fire({ icon: 'success', title: '¡Actualizado!', text: data.message, timer: 1500, showConfirmButton: false, confirmButtonColor: '#8B7355' })
                    .then(function () {
                        const modal = bootstrap.Modal.getInstance(document.getElementById('detalleModal'));
                        if (modal) modal.hide();
                        window.location.reload();
                    });
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: data.message, confirmButtonColor: '#8B7355' });
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        })
        .catch(function () {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Error de conexión', confirmButtonColor: '#8B7355' });
            btn.disabled = false;
            btn.innerHTML = originalContent;
        });
    });

    if (!container.querySelector('.detalle-item-edit')) agregarFila();
    setTimeout(function () { cargarArticulosDeBodega(bodegaSelect.value); }, 80);
})();
</script>
