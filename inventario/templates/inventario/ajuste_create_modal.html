<div class="modal-content border-0 ajuste-doc">
    <div class="ajuste-doc-header">
        <div class="ajuste-doc-icon"><i class="fas fa-exchange-alt"></i></div>
        <div class="flex-grow-1">
            <h5>Nuevo ajuste de inventario</h5>
            <p>Registre entradas o salidas de stock con detalle de artículos</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body ajuste-doc-body">
        <form method="post" id="ajusteCreateForm" action="{% url 'inventario:ajuste_create_simple' %}">
            {% csrf_token %}
            <input type="hidden" name="detalles_data" id="detalles_data_create">

            <div class="ajuste-ficha">
                <div class="row g-2">
                    <div class="col-6 col-lg-3">
                        <label class="form-label-stone">Tipo</label>
                        <select name="tipo_ajuste" class="form-select-stone" required id="tipoAjusteSelectCreate">
                            <option value="">Seleccionar...</option>
                            <option value="ENTRADA">Entrada (+ stock)</option>
                            <option value="SALIDA">Salida (− stock)</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label-stone">Fecha</label>
                        <input type="date" name="fecha_ajuste" class="form-control-stone" required>
                    </div>
                    <div class="col-6 col-lg-3">
                        <label class="form-label-stone">Bodega</label>
                        <select name="bodega" class="form-select-stone" required onchange="cargarArticulosCreate()">
                            <option value="">Seleccionar bodega...</option>
                            {% for bodega in bodegas %}
                                <option value="{{ bodega.id }}">{{ bodega.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-6 col-lg-4">
                        <label class="form-label-stone">Motivo</label>
                        <input type="text" name="descripcion" class="form-control-stone" required
                               placeholder="Motivo del ajuste">
                    </div>
                </div>
            </div>

            <div class="details-container">
                <div class="ajuste-toolbar">
                    <div class="ajuste-toolbar-title">
                        Detalle <span id="create-count-label">0 ítems</span>
                    </div>
                    <div class="ajuste-toolbar-actions">
                        <button type="button" class="btn btn-sm btn-articulos-f10" data-articulos-f10 title="Buscar artículos (F10)">
                            <i class="fas fa-search me-1"></i>F10
                        </button>
                    </div>
                </div>
                <div style="max-height: 280px; overflow: auto;">
                    <table class="table-stone">
                        <thead>
                            <tr>
                                <th style="width: 38%;">Artículo</th>
                                <th class="text-end" style="width: 10%;">Stock</th>
                                <th class="text-end" style="width: 12%;">Cantidad</th>
                                <th class="text-end" style="width: 13%;">Costo u.</th>
                                <th class="text-end" style="width: 12%;">Subtotal</th>
                                <th style="width: 12%;">Nota</th>
                                <th style="width: 3%;"></th>
                            </tr>
                        </thead>
                        <tbody id="detallesBodyCreate"></tbody>
                    </table>
                </div>
                <div id="emptyMessage" class="text-center py-3" style="display: none; color: #8B7355;">
                    <small>Seleccione bodega y agregue artículos</small>
                </div>
                <button type="button" class="btn-add-row" onclick="agregarDetalleCreate()">
                    <i class="fas fa-plus me-1"></i>Agregar artículo
                </button>
                <div class="ajuste-summary">
                    <div class="ajuste-summary-item">
                        <span>Neto</span>
                        <strong id="total-neto-display">$0</strong>
                    </div>
                    <div class="ajuste-summary-item">
                        <span>IVA 19%</span>
                        <strong id="total-iva-display">$0</strong>
                    </div>
                    <div class="ajuste-summary-item is-total">
                        <span>Total</span>
                        <strong id="total-final-display">$0</strong>
                    </div>
                </div>
            </div>

            <div class="ajuste-doc-footer">
                <button type="button" class="btn-doc-cancel" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-doc-save">
                    <i class="fas fa-check me-1"></i>Confirmar ajuste
                </button>
            </div>
        </form>
    </div>
</div>

<script>
var detalleCountCreate = 0;

// Inicialización
(function() {
    // Verificar si Select2 está cargado, si no, cargarlo dinámicamente
    if (typeof $.fn.select2 === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js';
        script.onload = initForm;
        document.head.appendChild(script);
        
        // También CSS si falta (aunque ya lo pusimos en base, por si acaso)
        if (!document.querySelector('link[href*="select2"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css';
            document.head.appendChild(link);
        }
    } else {
        initForm();
    }
})();

function initForm() {
    // Establecer fecha actual
    const now = new Date();
    const fechaInput = document.querySelector('#ajusteCreateForm input[name="fecha_ajuste"]');
    if (fechaInput) {
        fechaInput.value = now.toISOString().slice(0, 10);
    }
    
    // Listeners
    document.getElementById('tipoAjusteSelectCreate').addEventListener('change', actualizarSignosCantidadCreate);
    
    // Iniciar con una fila vacía
    setTimeout(() => {
        agregarDetalleCreate();
    }, 100);
}

function cargarArticulosCreate() {
    // Al cambiar la bodega, limpiar las filas existentes para evitar inconsistencias
    const tbody = document.getElementById('detallesBodyCreate');
    tbody.innerHTML = '';
    detalleCountCreate = 0;
    agregarDetalleCreate();
}

// Función ya no necesaria, Select2 maneja la carga
function actualizarSelectsArticulosCreate() {}

function agregarDetalleCreate() {
    const tbody = document.getElementById('detallesBodyCreate');
    if (!tbody) return;
    const emptyMsg = document.getElementById('emptyMessage');
    if (emptyMsg) emptyMsg.style.display = 'none';

    detalleCountCreate++;
    const tipoAjuste = document.getElementById('tipoAjusteSelectCreate').value;
    
    const signClass = tipoAjuste === 'SALIDA' ? 'sign-salida' : 'sign-entrada';
    const signSymbol = tipoAjuste === 'SALIDA' ? '-' : '+';
    
    const tr = document.createElement('tr');
    tr.id = `row-create-${detalleCountCreate}`;
    
    const bodegaSelect = document.querySelector('#ajusteCreateForm select[name="bodega"]');
    const bodegaId = bodegaSelect ? bodegaSelect.value : '';
    const articuloPlaceholder = bodegaId ? 'Buscar por código o nombre...' : 'Seleccione una bodega primero';
    
    tr.innerHTML = `
        <td class="detalle-select-cell">
            <select class="table-select articulo-select" name="detalles-${detalleCountCreate}-articulo" style="width: 100%;" ${bodegaId ? '' : 'disabled'}>
                <option value="">${articuloPlaceholder}</option>
            </select>
        </td>
        <td class="text-end">
            <span id="stock-display-${detalleCountCreate}" class="stock-cell-display">-</span>
        </td>
        <td>
            <div class="cantidad-wrapper">
                <span class="cantidad-sign-icon ${signClass}" id="sign-create-${detalleCountCreate}">${signSymbol}</span>
                <input type="number" class="table-input cantidad-input text-end" name="detalles-${detalleCountCreate}-cantidad" 
                       step="0.01" min="0.01" placeholder="0.00" oninput="calcularFilaCreate(${detalleCountCreate})" required>
            </div>
        </td>
        <td>
            <div class="input-group" style="flex-wrap: nowrap; height: 28px;">
                <span class="input-group-text border-0 text-muted px-1" style="background: transparent;">$</span>
                <input type="number" class="table-input costo-input text-end" name="detalles-${detalleCountCreate}-costo" 
                       step="0.01" min="0" placeholder="0.00" oninput="calcularFilaCreate(${detalleCountCreate})"
                       style="border-color: #D4C4A8; box-shadow: none;">
            </div>
        </td>
        <td>
            <div class="d-flex align-items-center justify-content-end w-100 pe-2 text-dark font-monospace fw-bold" style="height: 28px;">
                $<span class="subtotal-display" id="subtotal-display-${detalleCountCreate}">0</span>
                <input type="hidden" class="subtotal-input" id="subtotal-${detalleCountCreate}" value="0">
            </div>
        </td>
        <td>
            <input type="text" class="table-input" name="detalles-${detalleCountCreate}-comentario" 
                   placeholder="Opcional">
        </td>
        <td class="text-center">
            <button type="button" class="btn-remove-item" onclick="eliminarDetalleCreate(${detalleCountCreate})" title="Eliminar fila">
                <i class="fas fa-times"></i>
            </button>
        </td>
    `;
    
    tbody.appendChild(tr);
    actualizarContadorCreate();
    
    // Inicializar Select2
    const rowId = detalleCountCreate;
    $(`select[name="detalles-${rowId}-articulo"]`).select2({
        dropdownParent: $('#detalleModal'), // Importante para que funcione dentro del modal
        dropdownCssClass: 'ajuste-masivo-dropdown',
        ajax: {
            url: '/inventario/api/articulos-ajuste/',
            dataType: 'json',
            delay: 250,
            data: function (params) {
                return {
                    q: params.term, // search term
                    bodega_id: bodegaSelect.value
                };
            },
            processResults: function (data) {
                return {
                    results: data.articulos.map(function(item) {
                        const pk = String(item.id).replace(/\D/g, '');
                        return {
                            id: pk,
                            text: `${item.codigo} - ${item.nombre}`,
                            codigo: item.codigo,
                            nombre: item.nombre,
                            stock: item.stock_actual,
                            unidad: item.unidad_medida,
                            precio: item.precio_promedio
                        };
                    })
                };
            },
            cache: true
        },
        placeholder: articuloPlaceholder,
        minimumInputLength: 0,
        language: {
            noResults: function() {
                if (!bodegaId) {
                    return "Seleccione una bodega primero";
                }
                return "No se encontraron resultados";
            },
            searching: function() {
                return "Buscando...";
            },
            inputTooShort: function() {
                return "Ingrese al menos un carácter";
            },
            errorLoading: function() {
                return "Error al cargar resultados";
            }
        },
        templateResult: formatRepo,
        templateSelection: formatRepoSelection,
        escapeMarkup: function(markup) { return markup; }
    }).on('select2:opening', function (e) {
        if (!bodegaSelect.value) {
            e.preventDefault();
        }
    }).on('select2:select', function (e) {
        const data = e.params.data;
        const pk = String(data && data.id != null ? data.id : '').replace(/\D/g, '');
        if (pk) {
            this.setAttribute('data-articulo-id', pk);
            $(this).val(pk);
        }
        const stockDisplay = document.getElementById(`stock-display-${rowId}`);
        if (stockDisplay) {
            stockDisplay.textContent = Number(data.stock || 0).toLocaleString('es-CL');
        }
        const costoInput = document.querySelector(`input[name="detalles-${rowId}-costo"]`);
        if (costoInput) {
            costoInput.value = data.precio || 0;
            calcularFilaCreate(rowId);
        }
    });
}

function idArticuloFila(sel) {
    if (!sel) return '';
    const attr = (sel.getAttribute('data-articulo-id') || '').replace(/\D/g, '');
    if (attr) return attr;
    if (window.jQuery && $(sel).data('select2')) {
        const d = $(sel).select2('data');
        if (d && d[0] && d[0].id != null) {
            const pk = String(d[0].id).replace(/\D/g, '');
            if (pk) return pk;
        }
    }
    return String(sel.value || '').replace(/\D/g, '');
}

function formatRepo (repo) {
    if (repo.loading) {
        return repo.text;
    }
    const codigo = repo.codigo || '';
    const nombre = repo.nombre || repo.text || '';
    const stock = Number(repo.stock || 0).toLocaleString('es-CL');
    return `
        <div class="ajuste-option">
            <span class="ajuste-option__code">${codigo}</span>
            <span class="ajuste-option__name">${nombre}</span>
            <span class="ajuste-option__stock">Stock ${stock}</span>
        </div>
    `;
}

function formatRepoSelection (repo) {
    if (!repo.id) {
        return repo.text || 'Buscar artículo...';
    }
    const codigo = repo.codigo || '';
    const nombre = repo.nombre || repo.text || '';
    if (codigo && nombre && String(nombre).indexOf(codigo) === -1) {
        return codigo + ' — ' + nombre;
    }
    return nombre || codigo || repo.text;
}

function calcularFilaCreate(id) {
    const row = document.getElementById(`row-create-${id}`);
    if (!row) return;
    
    const cantidad = parseFloat(row.querySelector('.cantidad-input').value) || 0;
    const costo = parseFloat(row.querySelector('.costo-input').value) || 0;
    
    const subtotal = cantidad * costo;
    
    const subtotalInput = document.getElementById(`subtotal-${id}`);
    const subtotalDisplay = document.getElementById(`subtotal-display-${id}`);
    
    if (subtotalInput && subtotalDisplay) {
        subtotalInput.value = subtotal;
        subtotalDisplay.textContent = Math.round(subtotal).toLocaleString('es-CL');
    }
    
    calcularTotalesGlobalesCreate();
}

function calcularTotalesGlobalesCreate() {
    let neto = 0;
    document.querySelectorAll('.subtotal-input').forEach(input => {
        neto += parseFloat(input.value || 0);
    });
    
    const iva = Math.round(neto * 0.19);
    const total = Math.round(neto + iva);
    
    const displayNeto = document.getElementById('total-neto-display');
    const displayIva = document.getElementById('total-iva-display');
    const displayTotal = document.getElementById('total-final-display');
    
    if (displayNeto) displayNeto.textContent = neto.toLocaleString('es-CL', {style: 'currency', currency: 'CLP', maximumFractionDigits: 0});
    if (displayIva) displayIva.textContent = iva.toLocaleString('es-CL', {style: 'currency', currency: 'CLP', maximumFractionDigits: 0});
    if (displayTotal) displayTotal.textContent = total.toLocaleString('es-CL', {style: 'currency', currency: 'CLP', maximumFractionDigits: 0});
}

function actualizarContadorCreate() {
    const tbody = document.getElementById('detallesBodyCreate');
    const label = document.getElementById('create-count-label');
    if (!label) return;
    const n = tbody ? tbody.children.length : 0;
    label.textContent = n + (n === 1 ? ' ítem' : ' ítems');
}

function eliminarDetalleCreate(id) {
    const row = document.getElementById(`row-create-${id}`);
    if (row) {
        row.remove();
        actualizarContadorCreate();
        
        const tbody = document.getElementById('detallesBodyCreate');
        if (tbody.children.length === 0) {
            document.getElementById('emptyMessage').style.display = 'block';
            // Opcional: Agregar automáticamente una nueva fila si se queda vacío
            setTimeout(() => agregarDetalleCreate(), 100);
        }
        
        calcularTotalesGlobalesCreate(); // Recalcular al borrar
    }
}

function actualizarSignosCantidadCreate() {
    const tipoAjuste = document.getElementById('tipoAjusteSelectCreate').value;
    const signos = document.querySelectorAll('#ajusteCreateForm .cantidad-sign-icon');
    
    const isSalida = tipoAjuste === 'SALIDA';
    const newClass = isSalida ? 'sign-salida' : 'sign-entrada';
    const oldClass = isSalida ? 'sign-entrada' : 'sign-salida';
    const symbol = isSalida ? '-' : '+';
    
    signos.forEach(signo => {
        signo.textContent = symbol;
        signo.classList.remove(oldClass);
        signo.classList.add(newClass);
    });
}

// Validación y envío del formulario
document.getElementById('ajusteCreateForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const rows = document.querySelectorAll('#detallesBodyCreate tr');
    let detallesData = [];
    
    rows.forEach(row => {
        const articuloSelect = row.querySelector('.articulo-select');
        const cantidadInput = row.querySelector('input[name*="cantidad"]');
        const comentarioInput = row.querySelector('input[name*="comentario"]');
        
        const articuloId = idArticuloFila(articuloSelect);
        if (articuloSelect && articuloId && cantidadInput && cantidadInput.value) {
            detallesData.push({
                articulo_id: parseInt(articuloId, 10),
                cantidad: parseFloat(cantidadInput.value),
                comentario: comentarioInput ? comentarioInput.value : ''
            });
        }
    });
    
    if (detallesData.length === 0) {
        Swal.fire({
            icon: 'warning',
            title: 'Atención',
            text: 'Debe agregar al menos un artículo con cantidad válida.',
            confirmButtonColor: '#8B7355'
        });
        return;
    }
    
    document.getElementById('detalles_data_create').value = JSON.stringify(detallesData);
    
    const formData = new FormData(this);
    
    // Deshabilitar botón
    const btnSubmit = this.querySelector('button[type="submit"]');
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Guardando...';
    
    fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            Swal.fire({
                icon: 'success',
                title: '¡Ajuste Finalizado!',
                text: data.message,
                confirmButtonColor: '#8B7355',
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-print me-2"></i> Imp. Comprobante',
                cancelButtonText: 'Cerrar',
                reverseButtons: true
            }).then((result) => {
                if(result.isConfirmed && data.ajuste_id) {
                    // Abrir vista para imprimir/PDF
                    window.open((typeof gcWithReturnUrl === 'function' ? gcWithReturnUrl('/inventario/ajuste/' + data.ajuste_id + '/imprimir/') : '/inventario/ajuste/' + data.ajuste_id + '/imprimir/'), '_blank');
                }
                window.location.reload();
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: data.message,
                confirmButtonColor: '#8B7355'
            });
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fas fa-check me-1"></i>Confirmar ajuste';
        }
    })
    .catch(error => {
        Swal.fire({
            icon: 'error',
            title: 'Error de Conexión',
            text: 'No se pudo contactar con el servidor.',
            confirmButtonColor: '#8B7355'
        });
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fas fa-check me-1"></i>Confirmar ajuste';
    });
});
</script>
